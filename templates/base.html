{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/arquivo_com_estilos.css' %}">
    <title>{% block title %}Vetapp{% endblock title %}</title>
</head>
<body>
    <header class="site-header">
        <a class="brand-link" href="{% url 'core:home' %}">
            <img class="brand-logo" src="{% static 'img/img.png' %}" alt="Vetapp - início" width="200" height="60">
        </a>
        <nav class="primary-nav" aria-label="Navegação principal">
            <a class="primary-nav__link" href="{% url 'cliente:list_cliente' %}">Clientes</a>
            <a class="primary-nav__link" href="{% url 'especialidade:list_especialidade' %}">Especialidades</a>
            <a class="primary-nav__link" href="{% url 'veterinario:list_veterinario' %}">Veterinários</a>
            <a class="primary-nav__link" href="{% url 'atendimento:list_atendimento' %}">Atendimentos</a>
            <a class="primary-nav__link" href="{% url 'prontuario:list_prontuario' %}">Prontuários</a>
            <a class="primary-nav__link" href="{% url 'pagamento:list_pagamento' %}">Pagamentos</a>
            <a class="primary-nav__link" href="{% url 'animal:list_animal' %}">Animais</a>
            <a class="primary-nav__link" href="{% url 'tipoanimal:list_tipoanimal' %}">Tipos de Animais</a>
            <a class="primary-nav__link" href="{% url 'tipoconsulta:list_tipo_consulta' %}">Tipos de Consulta</a>
            <a class="primary-nav__link" href="{% url 'tipoexame:list_tipoexame' %}">Tipos de Exame</a>
            <a class="primary-nav__link" href="{% url 'atendimentoexame:list_atendimentoexame' %}">Atendimento/Exames</a>
        </nav>
    </header>

    <main class="page-content">
        {% block body %}
        {% endblock body %}
    </main>
    
    <script src="{% static 'js/arquivo_com_javascript.js' %}"></script>
</body>
</html>
